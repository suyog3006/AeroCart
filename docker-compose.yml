services:
  # -------------------------------------------------
  # Infrastructure
  # -------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerocart
      POSTGRES_PASSWORD: aerocart_pwd
      POSTGRES_DB: aerocart
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "aerocart" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aero-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aero-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "zookeeper-shell", "localhost:2181", "ls", "/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aero-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # -------------------------------------------------
  # Microservices (built from local Dockerfiles)
  # -------------------------------------------------
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: aero-gateway
    restart: unless-stopped
    depends_on:
      - user-service
      - inventory-service
      - order-service
      - notification-service
      - postgres
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerocart
      - SPRING_DATASOURCE_USERNAME=aerocart
      - SPRING_DATASOURCE_PASSWORD=aerocart_pwd
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8080:8080"

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: aero-user
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerocart
      - SPRING_DATASOURCE_USERNAME=aerocart
      - SPRING_DATASOURCE_PASSWORD=aerocart_pwd
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: aero-inventory
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerocart
      - SPRING_DATASOURCE_USERNAME=aerocart
      - SPRING_DATASOURCE_PASSWORD=aerocart_pwd
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8084:8084"

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: aero-order
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerocart
      - SPRING_DATASOURCE_USERNAME=aerocart
      - SPRING_DATASOURCE_PASSWORD=aerocart_pwd
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8083:8083"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: aero-notification
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8085:8085"

volumes:
  pg_data:
