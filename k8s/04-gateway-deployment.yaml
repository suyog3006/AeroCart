apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: aerocart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: aerocart/gateway-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8082"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8083"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: aerocart
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: gateway-service
