apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: aerocart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: aerocart/notification-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: aerocart
spec:
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: notification-service
