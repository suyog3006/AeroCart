name: AeroCart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build All Modules
        run: mvn clean test -DskipITs

      - name: Run Concurrency Integration Tests
        run: mvn test -f tests/pom.xml -Dtest=ConcurrentCheckoutIntegrationTest

  docker-build-and-push:
    name: Build & Push Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [gateway-service, user-service, inventory-service, order-service, notification-service]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

- name: Export Docker Hub Secrets
  id: export-docker-secrets
  run: |
    echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
    echo "DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}" >> $GITHUB_ENV
    if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
      echo "has_secrets=true" >> $GITHUB_OUTPUT
    else
      echo "has_secrets=false" >> $GITHUB_OUTPUT
    fi

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  deploy-to-k8s:
    name: Deploy to Kubernetes Cluster (EKS/GKE)
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Check AWS Secrets
        id: check-aws-secrets
        run: |
- name: Export AWS Secrets
  id: export-aws-secrets
  run: |
    echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
    echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
    if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
      echo "has_aws=true" >> $GITHUB_OUTPUT
    else
      echo "has_aws=false" >> $GITHUB_OUTPUT
    fi

      - name: Configure AWS Credentials (EKS)
        if: steps.check-aws-secrets.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig for EKS Cluster
        if: steps.check-aws-secrets.outputs.has_aws == 'true'
        run: aws eks update-kubeconfig --name aerocart-eks-cluster --region us-east-1

      - name: Deploy Kubernetes Manifests
        if: steps.check-aws-secrets.outputs.has_aws == 'true'
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-postgres-sharded.yaml
          kubectl apply -f k8s/02-redis-deployment.yaml
          kubectl apply -f k8s/03-kafka-deployment.yaml
          kubectl apply -f k8s/04-gateway-deployment.yaml
          kubectl apply -f k8s/05-user-deployment.yaml
          kubectl apply -f k8s/06-inventory-deployment.yaml
          kubectl apply -f k8s/07-order-deployment.yaml
          kubectl apply -f k8s/08-notification-deployment.yaml
          kubectl apply -f k8s/09-hpa.yaml

      - name: Verify Deployment Rollout Status
        if: steps.check-aws-secrets.outputs.has_aws == 'true'
        run: |
          kubectl rollout status deployment/gateway-service -n aerocart
          kubectl rollout status deployment/inventory-service -n aerocart
          kubectl rollout status deployment/order-service -n aerocart
