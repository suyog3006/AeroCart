global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aerocart-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway-service:8080'
          - 'user-service:8081'
          - 'inventory-service:8082'
          - 'order-service:8083'
          - 'notification-service:8084'
